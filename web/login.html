<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MongoCollectibles</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Tailwind Config for brand colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#144037',
              950: '#0a2920',
            },
            accent: {
              500: '#f97316',
              600: '#ea580c',
            }
          }
        }
      }
    }
  </script>
</head>

<!--
  =============================================
  LOGIN PAGE
  =============================================
  Simple login form with email/password authentication.
-->
<body class="bg-gradient-to-br from-brand-900 via-brand-800 to-brand-700 min-h-screen flex flex-col">

  <!-- ==================== NAVIGATION ==================== -->
  <nav class="p-4">
    <a href="/" class="inline-flex items-center space-x-2 text-white/80 hover:text-white transition-colors">
      <span class="text-2xl">🎭</span>
      <span class="font-bold text-xl">MongoCollectibles</span>
    </a>
  </nav>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="flex-1 flex justify-center items-center px-4 py-8">
    
    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
      
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-800">Welcome Back</h1>
        <p class="text-gray-600 mt-1">Sign in to your account</p>
      </div>

      <!-- Error Message Container -->
      <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
      </div>

      <!-- Success Message Container -->
      <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-6">
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        
        <!-- Email Input -->
        <div class="mb-5">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email Address
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@example.com"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
        </div>

        <!-- Password Input -->
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Password
          </label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-brand-900 hover:bg-brand-800 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-lg transition-colors">
          Sign In
        </button>

      </form>

      <!-- Register Link -->
      <div class="mt-8 pt-6 border-t border-gray-200 text-center">
        <span class="text-gray-600">Don't have an account?</span>
        <a href="/register" class="text-brand-700 hover:text-brand-800 font-semibold ml-1 transition-colors">
          Create one
        </a>
      </div>

    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="py-6 text-center">
    <p class="text-white/50 text-sm">© 2026 MongoCollectibles. All rights reserved.</p>
  </footer>

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    // ========================================
    // CHECK IF ALREADY LOGGED IN
    // ========================================
    // Redirect to home if user already has a valid token
    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = '/';
      }
    });

    // ========================================
    // HANDLE LOGIN FORM SUBMISSION
    // ========================================
    async function handleLogin(event) {
      // Prevent default form submission (page reload)
      event.preventDefault();

      // Get DOM elements
      const submitBtn = document.getElementById('submitBtn');
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');

      // Get form values
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Reset messages
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      // Show loading state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        // Send login request to backend API
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
          // Login successful!
          // Store JWT token in localStorage for future authenticated requests
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          // Show success and redirect
          successDiv.textContent = 'Login successful! Redirecting...';
          successDiv.classList.remove('hidden');

          setTimeout(() => {
            window.location.href = '/';
          }, 1000);

        } else {
          // Login failed - show error
          errorDiv.textContent = data.error || 'Login failed. Please try again.';
          errorDiv.classList.remove('hidden');
          
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }

      } catch (error) {
        // Network error
        console.error('Login error:', error);
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.classList.remove('hidden');
        
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }
  </script>

</body>
</html>
