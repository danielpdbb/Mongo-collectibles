<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MongoCollectibles</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Tailwind Config for brand colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#144037',
              950: '#0a2920',
            },
            accent: {
              500: '#f97316',
              600: '#ea580c',
            }
          }
        }
      }
    }
  </script>
</head>

<!--
  =============================================
  REGISTRATION PAGE
  =============================================
  New user registration with name, email, phone, and password.
-->
<body class="bg-gradient-to-br from-brand-900 via-brand-800 to-brand-700 min-h-screen flex flex-col">

  <!-- ==================== NAVIGATION ==================== -->
  <nav class="p-4">
    <a href="/" class="inline-flex items-center space-x-2 text-white/80 hover:text-white transition-colors">
      <span class="text-2xl">🎭</span>
      <span class="font-bold text-xl">MongoCollectibles</span>
    </a>
  </nav>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="flex-1 flex justify-center items-center px-4 py-8">
    
    <!-- Register Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
      
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-800">Create Account</h1>
        <p class="text-gray-600 mt-1">Join MongoCollectibles today</p>
      </div>

      <!-- Error Message Container -->
      <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
      </div>

      <!-- Success Message Container -->
      <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-6">
      </div>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)">
        
        <!-- Full Name Input -->
        <div class="mb-5">
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
            Full Name
          </label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="John Doe"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
        </div>

        <!-- Email Input -->
        <div class="mb-5">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email Address
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@example.com"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
        </div>

        <!-- Phone Input (Optional) -->
        <div class="mb-5">
          <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
            Phone Number <span class="text-gray-400 font-normal">(Optional)</span>
          </label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="09XX XXX XXXX"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
        </div>

        <!-- Password Input -->
        <div class="mb-5">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Password
          </label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Create a password"
            minlength="6"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
          <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
        </div>

        <!-- Confirm Password Input -->
        <div class="mb-6">
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
            Confirm Password
          </label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            placeholder="Confirm your password"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-accent-500 hover:bg-accent-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-lg transition-colors">
          Create Account
        </button>

      </form>

      <!-- Login Link -->
      <div class="mt-8 pt-6 border-t border-gray-200 text-center">
        <span class="text-gray-600">Already have an account?</span>
        <a href="/login" class="text-brand-700 hover:text-brand-800 font-semibold ml-1 transition-colors">
          Sign in
        </a>
      </div>

    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="py-6 text-center">
    <p class="text-white/50 text-sm">© 2026 MongoCollectibles. All rights reserved.</p>
  </footer>

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    // ========================================
    // CHECK IF ALREADY LOGGED IN
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = '/';
      }
    });

    // ========================================
    // HANDLE REGISTRATION FORM SUBMISSION
    // ========================================
    async function handleRegister(event) {
      // Prevent default form submission
      event.preventDefault();

      // Get DOM elements
      const submitBtn = document.getElementById('submitBtn');
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');

      // Get form values
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Reset messages
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      // Validate passwords match
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.classList.remove('hidden');
        return;
      }

      // Validate password length
      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters';
        errorDiv.classList.remove('hidden');
        return;
      }

      // Show loading state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        // Send registration request to backend API
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });

        const data = await response.json();

        if (data.success) {
          // Registration successful!
          // Auto-login: store token immediately
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          // Show success and redirect
          successDiv.textContent = 'Account created successfully! Redirecting...';
          successDiv.classList.remove('hidden');

          setTimeout(() => {
            window.location.href = '/';
          }, 1000);

        } else {
          // Registration failed
          errorDiv.textContent = data.error || 'Registration failed. Please try again.';
          errorDiv.classList.remove('hidden');
          
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }

      } catch (error) {
        // Network error
        console.error('Registration error:', error);
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.classList.remove('hidden');
        
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    }
  </script>

</body>
</html>
